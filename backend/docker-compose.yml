version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: childs_health_db
    environment:
      POSTGRES_USER: childs_health
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: childs_health_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childs_health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI приложение
  api:
    build: .
    container_name: childs_health_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://childs_health:change_me_in_production@postgres:5432/childs_health_db
      YC_STORAGE_ACCESS_KEY: ${YC_STORAGE_ACCESS_KEY}
      YC_STORAGE_SECRET_KEY: ${YC_STORAGE_SECRET_KEY}
      YC_STORAGE_BUCKET_NAME: ${YC_STORAGE_BUCKET_NAME}
      YC_STORAGE_ENDPOINT: https://storage.yandexcloud.net
      YC_STORAGE_REGION: ru-central1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      QR_TOKEN_EXPIRE_HOURS: 48
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    restart: unless-stopped

volumes:
  postgres_data:
