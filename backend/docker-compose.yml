version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: childs_health_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-childs_health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env file}
      POSTGRES_DB: ${POSTGRES_DB:-childs_health_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-childs_health}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI приложение
  api:
    build: .
    container_name: childs_health_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env file}
      YC_STORAGE_ACCESS_KEY: ${YC_STORAGE_ACCESS_KEY:?YC_STORAGE_ACCESS_KEY must be set}
      YC_STORAGE_SECRET_KEY: ${YC_STORAGE_SECRET_KEY:?YC_STORAGE_SECRET_KEY must be set}
      YC_STORAGE_BUCKET_NAME: ${YC_STORAGE_BUCKET_NAME:?YC_STORAGE_BUCKET_NAME must be set}
      YC_STORAGE_ENDPOINT: https://storage.yandexcloud.net
      YC_STORAGE_REGION: ru-central1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env file}
      JWT_ALGORITHM: HS256
      QR_TOKEN_EXPIRE_HOURS: ${QR_TOKEN_EXPIRE_HOURS:-48}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    restart: unless-stopped

volumes:
  postgres_data:
