name: childs_health_card
description: Приложение для учёта здоровья детей - визиты, анализы, процедуры, лекарства
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Локализация
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1

  # State Management
  provider: ^6.1.1

  # Навигация
  go_router: ^13.0.0

  # Локальная база данных (SQLite + Drift ORM)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.8.3

  # Работа с датами
  table_calendar: ^3.0.9

  # UI компоненты
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Графики и статистика
  fl_chart: ^0.66.0

  # Утилиты
  uuid: ^4.3.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Сеть и API
  http: ^1.1.2

  # Резервное копирование
  archive: ^3.4.9
  permission_handler: ^11.1.0
  file_picker: ^6.1.1

  # Безопасность (PIN код)
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0

  # Иконки
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # Ресурсы приложения
  assets:
    - assets/images/
    - assets/icons/

  # Локализация
  generate: true
